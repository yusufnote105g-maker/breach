name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  android:
    name: Godot -> APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Install Godot
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot/godot" ]; then
            mkdir -p "$HOME/godot"
            curl -sSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d "$HOME/godot"
            mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
            chmod +x "$HOME/godot/godot"
          fi
          "$HOME/godot/godot" --headless --version

      - name: Install export templates
        run: |
          set -euo pipefail
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL/android_debug.apk" ]; then
            curl -sSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -q /tmp/templates.tpz -d /tmp/tpl
            mkdir -p "$(dirname "$TPL")"
            rm -rf "$TPL"
            mv /tmp/tpl/templates "$TPL"
          fi
          ls "$TPL" | head -5
          cat "$TPL/version.txt"

      - name: Import project (builds .godot cache)
        run: |
          set -euo pipefail
          "$HOME/godot/godot" --headless --path . --import --quit-after 2 || \
            "$HOME/godot/godot" --headless --path . --editor --quit

      - name: Headless boot test (scripts must load and tick)
        run: "$HOME/godot/godot" --headless --path . --quit-after 30

      - name: Debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$HOME/.android/debug.keystore" \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi
          sed -i "s|__DEBUG_KEYSTORE__|$HOME/.android/debug.keystore|" export_presets.cfg

      - name: Export APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          mkdir -p build
          "$HOME/godot/godot" --headless --path . --export-debug "Android" build/breach.apk
          ls -la build/

      - name: Inspect APK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('build/breach.apk')
          names = z.namelist()
          print('entries:', len(names))
          for want in ['AndroidManifest.xml', 'classes.dex']:
              print(('ok  ' if want in names else 'MISS'), want)
          libs = sorted(n for n in names if n.startswith('lib/'))
          print('native libs:', libs[:6])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: breach-apk
          path: build/breach.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Breach debug APK, built from ${{ github.sha }}.
          files: build/breach.apk
